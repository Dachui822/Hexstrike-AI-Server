tool: dirsearch
binary: dirsearch
target_placement: flag
target_flag: -u
parameters:
  extensions:
    flag: -e
    type: string
    required: false
  wordlist:
    flag: -w
    type: string
    required: false
  threads:
    flag: -t
    type: integer
    required: false
    validators:
      min: 1
      max: 100
  recursive:
    flag: -r
    type: boolean
    required: false
  additional_args:
    type: string
    required: false
